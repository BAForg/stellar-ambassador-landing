let current = 0;
let notesCache = [];

// ---------- capa de datos: Supabase con fallback local ----------
function initClient(){
  try{
    if(SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length>20 && window.supabase){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return true;
    }
  }catch(e){ console.error(e); }
  SHARED=false; return false;
}
function rowToNote(r){ return {id:r.id, tier:r.tier, cat:r.cat, text:r.text, author:r.author, ts:new Date(r.created_at).getTime()}; }
async function fetchNotes(){
  if(sb){
    try{
      const {data,error}=await sb.from('workshop_notes').select('*').order('created_at',{ascending:true});
      if(error) throw error;
      return data.map(rowToNote);
    }catch(e){ console.error(e); SHARED=false; updateBanner(); }
  }
  return localNotes.slice();
}
async function putNote(draft){
  if(sb){
    try{
      const {data,error}=await sb.from('workshop_notes')
        .insert({tier:draft.tier, cat:draft.cat, text:draft.text, author:draft.author})
        .select().single();
      if(error) throw error;
      return rowToNote(data);
    }catch(e){ console.error(e); SHARED=false; updateBanner(); }
  }
  if(!draft.id) draft.id='local-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  localNotes.push(draft); return draft;
}
async function delNote(id){
  if(sb){
    try{ const {error}=await sb.from('workshop_notes').delete().eq('id',id); if(error) throw error; return; }
    catch(e){ console.error(e); SHARED=false; updateBanner(); }
  }
  localNotes = localNotes.filter(n=>n.id!==id);
}
async function clearAll(){
  if(sb){
    try{ const {error}=await sb.from('workshop_notes').delete().neq('id','00000000-0000-0000-0000-000000000000'); if(error) throw error; return; }
    catch(e){ console.error(e); SHARED=false; updateBanner(); }
  }
  localNotes = [];
}
function subscribeRealtime(){
  if(!sb) return;
  sb.channel('workshop_notes_rt')
    .on('postgres_changes', {event:'*', schema:'public', table:'workshop_notes'}, async ()=>{
      notesCache = await fetchNotes(); renderSteps(); renderBoard();
    })
    .subscribe();
}
function updateBanner(){
  const b = document.getElementById('storeBanner');
  if(SHARED){ b.className='banner shared'; b.textContent='Conectado a Supabase · noticas en vivo para todo el equipo'; }
  else { b.className='banner local'; b.textContent='Sin conexión a Supabase · revisa tus llaves en index.html (modo local, no se comparte)'; }
}

// ---------- render ----------
function renderKpis(){
  const el = document.getElementById('kpibar');
  const cards = KPIS.map(k=>
    '<div class="kpi" style="--kc:'+k.color+'" title="'+k.full+'">'
    +'<div class="kpi-code">'+k.code+'</div>'
    +'<div class="kpi-num">'+k.target+'<span>/'+k.unit+'</span></div>'
    +'<div class="kpi-via">'+k.full+' · '+k.via+'</div>'
    +'</div>').join('');
  el.innerHTML =
    '<div class="kpi-head"><span class="kpi-title">Metas por capítulo</span>'
    +'<span class="kpi-note">No son metas globales · cada capítulo cumple las suyas</span></div>'
    +'<div class="kpi-funnel">Eventos → Members → Builders → Instawards → SCF</div>'
    +'<div class="kpi-cards">'+cards+'</div>';
}
function kpiChips(tierId){
  const ids = TIER_KPIS[tierId] || [];
  if(!ids.length) return '';
  const chips = ids.map(id=>{ const k=KPIS.find(x=>x.id===id); return '<span class="kchip" style="--kc:'+k.color+'">'+k.code+'</span>'; }).join('');
  return '<div class="kpi-feeds"><span class="kpi-feeds-l">Alimenta KPIs</span>'+chips+'</div>';
}
function renderSteps(){
  const el = document.getElementById('steps');
  el.innerHTML = STATIONS.map((s,i)=>{
    const c = notesCache.filter(n=>n.tier===s.id).length;
    return '<div class="step '+(i===current?'active':'')+'" style="--accent:'+s.accent+'" data-i="'+i+'">'
      +'<div class="k">'+s.k+'</div>'
      +'<div class="n">'+s.n+'</div>'
      +'<div class="meta">'+(s.id==='rules'?'P1 · P2 · puntos':'requisitos + oportunidades')+'</div>'
      +'<div class="cnt">'+c+' notica'+(c===1?'':'s')+'</div>'
      +'</div>';
  }).join('');
  el.querySelectorAll('.step').forEach(st=>st.onclick=()=>{current=+st.dataset.i;renderAll();});
}
function renderDef(){
  const s = STATIONS[current];
  const reqTitle = s.id==='rules' ? 'Preguntas a resolver' : 'Requisitos de ascenso';
  const oppTitle = s.id==='rules' ? 'Contexto para decidir' : 'Oportunidades desbloqueadas';
  document.getElementById('defPanel').innerHTML =
    '<span class="pill" style="background:'+s.accent+'">'+s.k+'</span>'
    +'<h2 style="margin-top:10px">'+s.n+'</h2>'
    +'<div class="lifecycle">'+s.lifecycle+'</div>'
    +kpiChips(s.id)
    +'<div class="block-title"><span class="dot" style="background:'+(s.id==='rules'?'#7C5CE0':'#4A6CF7')+'"></span>'+reqTitle+'</div>'
    +'<ul class="items req">'+s.req.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    +'<div class="block-title"><span class="dot" style="background:#22B8D6"></span>'+oppTitle+'</div>'
    +'<ul class="items opp">'+s.opp.map(x=>'<li>'+x+'</li>').join('')+'</ul>'
    +'<div class="note-context"><b>Para discutir:</b> '+s.q+'</div>';
}
function renderBoard(){
  const s = STATIONS[current];
  const mine = notesCache.filter(n=>n.tier===s.id);
  const tally = Object.keys(CATS).map(k=>{
    const c = mine.filter(n=>n.cat===k).length;
    return '<span style="background:'+hexA(CATS[k].color,.12)+';color:'+CATS[k].color+'">'+CATS[k].label+': '+c+'</span>';
  }).join('');
  const catBtns = Object.keys(CATS).map(k=>
    '<button class="catbtn '+(k===selCat?'sel':'')+'" data-cat="'+k+'" style="'+(k===selCat?'background:'+CATS[k].color:'')+'">'+CATS[k].label+'</button>'
  ).join('');
  const cards = mine.slice().sort((a,b)=>b.ts-a.ts).map(n=>
    '<div class="note" style="--nc:'+CATS[n.cat].color+';background:'+hexA(CATS[n.cat].color,.06)+'">'
    +'<div class="txt">'+escapeHtml(n.text)+'</div>'
    +'<div class="meta">'
    +'<span class="cat" style="color:'+CATS[n.cat].color+'">'+CATS[n.cat].label+' · '+escapeHtml(n.author||'anónimo')+'</span>'
    +'<button class="del" data-id="'+n.id+'" title="Eliminar">✕</button>'
    +'</div></div>').join('');
  document.getElementById('boardPanel').innerHTML =
    '<div class="board-head"><h2>Tablero de noticas</h2><div class="tally">'+tally+'</div></div>'
    +'<div class="composer"><div class="catrow">'+catBtns+'</div>'
    +'<textarea id="noteText" placeholder="Escribe tu notica para este tier..."></textarea>'
    +'<div class="row"><span class="hint" id="nameHint"></span>'
    +'<button class="addbtn" id="addNote">Pegar notica</button></div></div>'
    +'<div class="notes">'+(cards || '<div class="empty">Aún no hay noticas en esta estación. Sé el primero.</div>')+'</div>';
  document.querySelectorAll('.catbtn').forEach(b=>b.onclick=()=>{selCat=b.dataset.cat;renderBoard();});
  document.getElementById('addNote').onclick = addNote;
  document.querySelectorAll('.note .del').forEach(b=>b.onclick=()=>removeNote(b.dataset.id));
  refreshNameHint();
}
function refreshNameHint(){
  const h=document.getElementById('nameHint'); if(!h) return;
  h.textContent = myName()? '' : 'Escribe tu nombre arriba para pegar noticas';
  const btn=document.getElementById('addNote'); if(btn) btn.disabled=!myName();
}
function renderAll(){ renderSteps(); renderDef(); renderBoard(); }

// ---------- acciones ----------
async function addNote(){
  const ta = document.getElementById('noteText');
  const text = (ta.value||'').trim();
  if(!text || !myName()) return;
  const draft = {tier:STATIONS[current].id, cat:selCat, text, author:myName(), ts:Date.now()};
  ta.value='';
  const saved = await putNote(draft);
  if(saved && saved.id && !notesCache.find(n=>n.id===saved.id)){ notesCache.push(saved); }
  renderSteps(); renderBoard();
}
async function removeNote(id){
  notesCache = notesCache.filter(n=>n.id!==id);
  renderSteps(); renderBoard();
  await delNote(id);
}
async function poll(){
  const fresh = await fetchNotes();
  const before = JSON.stringify(notesCache.map(n=>n.id).sort());
  const after = JSON.stringify(fresh.map(n=>n.id).sort());
  if(before!==after){ notesCache = fresh; renderSteps(); renderBoard(); }
}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}

// ---------- export ----------
function exportSummary(){
  let out = 'WORKSHOP DE TIERS - STELLAR AMBASSADOR PROGRAM\n'+new Date().toLocaleString()+'\n\n';
  STATIONS.forEach(s=>{
    out += '== '+s.k+' - '+s.n+' ==\n';
    const list = notesCache.filter(n=>n.tier===s.id);
    if(!list.length){ out+='(sin noticas)\n\n'; return; }
    Object.keys(CATS).forEach(k=>{
      const sub = list.filter(n=>n.cat===k);
      if(sub.length){ out+= CATS[k].label.toUpperCase()+':\n'; sub.forEach(n=>out+='  - '+n.text+' ('+ (n.author||'anónimo') +')\n'); }
    });
    out+='\n';
  });
  const blob=new Blob([out],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='workshop-tiers-resumen.txt'; a.click();
}

// ---------- timer ----------
let secs=3600, tick=null;
function fmt(){const m=String(Math.floor(secs/60)).padStart(2,'0');const s=String(secs%60).padStart(2,'0');document.getElementById('timer').textContent=m+':'+s;}
document.getElementById('tStart').onclick=function(){
  if(tick){clearInterval(tick);tick=null;this.textContent='Iniciar';return;}
  this.textContent='Pausar';
  tick=setInterval(()=>{if(secs>0){secs--;fmt();}else{clearInterval(tick);tick=null;document.getElementById('tStart').textContent='Iniciar';}},1000);
};
document.getElementById('tReset').onclick=function(){if(tick){clearInterval(tick);tick=null;document.getElementById('tStart').textContent='Iniciar';}secs=3600;fmt();};

// ---------- nav + util ----------
document.getElementById('prev').onclick=()=>{if(current>0){current--;renderAll();}};
document.getElementById('next').onclick=()=>{if(current<STATIONS.length-1){current++;renderAll();}};
document.getElementById('exportBtn').onclick=exportSummary;
document.getElementById('clearBtn').onclick=async()=>{
  if(confirm('¿Borrar TODAS las noticas del tablero? Esta acción no se puede deshacer.')){
    notesCache=[]; renderSteps(); renderBoard(); await clearAll();
  }
};
document.getElementById('nm').addEventListener('input',refreshNameHint);

// ---------- init ----------
(async function init(){
  const ok = initClient();
  updateBanner(); fmt(); renderKpis();
  notesCache = await fetchNotes();
  renderAll();
  if(ok){ subscribeRealtime(); }
  setInterval(poll, 8000);
})();
</script>
</body>
</html>
